<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Meal Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#FBF8F2;
  --paper-raised:#FFFFFF;
  --ink:#2B2925;
  --ink-soft:#6B6559;
  --pine:#3F5C43;
  --pine-deep:#2F4633;
  --rust:#B5502E;
  --rust-soft:#F1DFD3;
  --mustard:#C9973A;
  --mustard-soft:#F3E7CC;
  --sage-check:#7C9473;
  --line:#E6DECB;
  --shadow: 0 1px 2px rgba(43,41,37,0.06), 0 4px 14px rgba(43,41,37,0.05);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:40px;
}

.app{max-width:520px;margin:0 auto;padding:0 16px;}

/* Header */
.header{
  padding:22px 4px 14px 4px;
}
.eyebrow{
  font-size:11px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--pine);
  font-weight:600;
  margin:0 0 4px 0;
}
h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:30px;
  letter-spacing:-0.01em;
  margin:0 0 4px 0;
  color:var(--ink);
}
.cycle-range{
  font-size:13.5px;
  color:var(--ink-soft);
  margin:0;
}

/* Tabs - styled like recipe-box divider tabs */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:6px 2px 14px 2px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;
  padding:9px 14px 8px 14px;
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
  white-space:nowrap;
  position:relative;
  top:1px;
}
.tab.active{
  color:var(--pine-deep);
  background:var(--paper-raised);
  border-color:var(--pine);
  box-shadow: 0 -2px 0 0 var(--pine) inset;
}
.tab .dot{
  display:inline-block;
  width:6px;height:6px;border-radius:50%;
  background:var(--rust);
  margin-left:6px;
  vertical-align:middle;
  opacity:0;
}
.tab.current .dot{opacity:1;}

/* Panel */
.panel{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);
  padding:18px 16px 20px 16px;
  min-height:260px;
}

.section-title{
  font-family:'Fraunces',serif;
  font-size:18px;
  font-weight:600;
  margin:0 0 2px 0;
}
.section-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:0 0 16px 0;
}

/* Plan overview: day cards */
.week-block{margin-bottom:18px;}
.week-block:last-child{margin-bottom:0;}
.week-label{
  font-size:11px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--pine);
  margin-bottom:8px;
}
.day-card{
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:8px;
  background:var(--paper);
  cursor:pointer;
}
.day-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}
.day-name{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--rust);
  min-width:56px;
}
.meal-name{
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:600;
  flex:1;
}
.chev{color:var(--ink-soft);font-size:12px;transition:transform .15s;}
.day-card.open .chev{transform:rotate(90deg);}
.recipe-detail{
  max-height:0;
  overflow:hidden;
  transition:max-height .2s ease;
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.5;
}
.day-card.open .recipe-detail{
  max-height:200px;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
}
.tag-row{margin-top:6px;}
.tag{
  display:inline-block;
  font-size:10.5px;
  font-weight:600;
  padding:2px 7px;
  border-radius:20px;
  margin-right:5px;
}
.tag.costco{background:var(--mustard-soft);color:#8A6317;}
.tag.fresh{background:#DCE7DA;color:var(--pine-deep);}

/* Checklist */
.list-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 2px;
  border-bottom:1px solid var(--line);
}
.list-item:last-of-type{border-bottom:none;}
.checkbox{
  width:22px;height:22px;
  flex:0 0 22px;
  border:2px solid var(--ink-soft);
  border-radius:5px;
  cursor:pointer;
  position:relative;
  background:var(--paper-raised);
}
.checkbox.checked{
  background:var(--sage-check);
  border-color:var(--sage-check);
}
.checkbox.checked::after{
  content:"";
  position:absolute;
  left:6px;top:2px;
  width:6px;height:11px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
.item-label{
  flex:1;
  font-size:15px;
}
.item-label.checked{
  color:var(--ink-soft);
  text-decoration:line-through;
  text-decoration-color:var(--line);
}
.item-meta{
  font-size:11px;
  color:var(--ink-soft);
}
.item-remove{
  color:var(--ink-soft);
  font-size:18px;
  padding:0 4px;
  cursor:pointer;
  opacity:0.5;
}

.progress-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.progress-text{font-size:12px;color:var(--ink-soft);}
.reset-link{
  font-size:12px;
  color:var(--rust);
  font-weight:600;
  cursor:pointer;
  background:none;border:none;
  padding:0;
}

.add-row{
  display:flex;gap:8px;margin-top:14px;
}
.add-row input{
  flex:1;
  border:1px solid var(--line);
  border-radius:7px;
  padding:9px 10px;
  font-size:14px;
  font-family:inherit;
  background:var(--paper);
  color:var(--ink);
}
.add-row input:focus{outline:2px solid var(--pine);outline-offset:0;}
.add-row button{
  border:none;
  background:var(--pine);
  color:white;
  font-weight:600;
  font-size:13px;
  padding:0 16px;
  border-radius:7px;
  cursor:pointer;
}

.group-heading{
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--ink-soft);
  margin:16px 0 4px 0;
}
.group-heading:first-child{margin-top:0;}

.loading{
  text-align:center;
  padding:40px 0;
  color:var(--ink-soft);
  font-size:13px;
}
#storageBanner{
  background:var(--rust-soft);
  color:#7A3719;
  border:1px solid #E0B79C;
  border-radius:8px;
  padding:10px 12px;
  font-size:12.5px;
  line-height:1.5;
  margin-bottom:10px;
}
.not-saved{
  color:var(--rust);
  font-size:11px;
  font-weight:600;
  margin-left:6px;
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <p class="eyebrow">Four-week rotation · sample</p>
    <h1>Meal Plan</h1>
    <p class="cycle-range" id="cycleRange"></p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="storageBanner" style="display:none;"></div>
  <div class="panel" id="panel">
    <div class="loading">Loading your plan…</div>
  </div>
</div>

<script>
(function(){

// ---------- Sample data (this is what Claude would generate/edit for you each cycle) ----------
const recipes = {
  r1: { name:"Sheet-Pan Chicken Thighs & Broccoli", note:"Toss thighs + frozen broccoli with oil and salt, roast 25 min at 425°. Squeeze lemon at the end.",
        costco:["Chicken thighs","Frozen broccoli"], fresh:["Lemon"] },
  r2: { name:"Turkey Taco Bowls", note:"Brown turkey with taco seasoning, warm frozen corn, build bowls with romaine and avocado.",
        costco:["Ground turkey","Frozen corn"], fresh:["Romaine lettuce","Avocado"] },
  r3: { name:"Salmon & Roasted Asparagus", note:"Roast salmon and frozen asparagus together, 12–15 min at 400°. Finish with lemon.",
        costco:["Salmon fillets","Frozen asparagus"], fresh:["Lemon"] },
  r4: { name:"Beef & Broccoli Stir-Fry", note:"Sear beef strips, add frozen broccoli and stir-fry sauce, serve over rice. Top with green onion.",
        costco:["Beef stir-fry strips","Frozen broccoli"], fresh:["Green onion"] },
  r5: { name:"Shrimp & Stir-Fry Veg", note:"Sauté frozen shrimp and stir-fry vegetable mix, finish with lime and cilantro.",
        costco:["Shrimp (frozen bag)","Frozen stir-fry vegetable mix"], fresh:["Cilantro","Lime"] },
  r6: { name:"Italian Sausage & Peppers", note:"Sheet-pan sausage with frozen pepper strips, 25 min at 400°. Top with fresh basil.",
        costco:["Italian sausage","Frozen pepper strips"], fresh:["Basil"] },
};

const plan = [
  { label:"Week 1", days:[ {day:"Sun", slot:"1", r:"r1"}, {day:"Sun", slot:"2", r:"r2"}, {day:"Thu", slot:"", r:"r3"} ] },
  { label:"Week 2", days:[ {day:"Sun", slot:"1", r:"r4"}, {day:"Sun", slot:"2", r:"r5"}, {day:"Thu", slot:"", r:"r6"} ] },
  { label:"Week 3", days:[ {day:"Sun", slot:"1", r:"r1"}, {day:"Sun", slot:"2", r:"r3"}, {day:"Thu", slot:"", r:"r2"} ] },
  { label:"Week 4", days:[ {day:"Sun", slot:"1", r:"r5"}, {day:"Sun", slot:"2", r:"r6"}, {day:"Thu", slot:"", r:"r4"} ] },
];

function weekRecipeIds(weekIdx){
  return [...new Set(plan[weekIdx].days.map(d=>d.r))];
}
function costcoList(){
  const items = new Map(); // name -> [recipe names]
  plan.forEach(w=>w.days.forEach(d=>{
    recipes[d.r].costco.forEach(item=>{
      if(!items.has(item)) items.set(item, new Set());
      items.get(item).add(recipes[d.r].name);
    });
  }));
  return [...items.entries()].map(([name, usedIn])=>({name, meta:`for ${usedIn.size} recipe${usedIn.size>1?'s':''}`}));
}
function weekFreshList(weekIdx){
  const items = new Map();
  weekRecipeIds(weekIdx).forEach(rid=>{
    recipes[rid].fresh.forEach(item=>{
      if(!items.has(item)) items.set(item, new Set());
      items.get(item).add(recipes[rid].name);
    });
  });
  return [...items.entries()].map(([name, usedIn])=>({name, meta:[...usedIn].join(", ")}));
}

// today -> which week is "current" (just for the dot indicator + default tab), based on a fixed cycle start
const CYCLE_START = new Date(2026, 7, 3); // Aug 3, 2026 (a Monday) - sample cycle start
function currentWeekIndex(){
  const now = new Date();
  const diffDays = Math.floor((now - CYCLE_START) / 86400000);
  const wk = Math.floor(diffDays / 7);
  return Math.min(Math.max(wk,0), 3);
}

function fmtDate(d){ return d.toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
const cycleEnd = new Date(CYCLE_START); cycleEnd.setDate(cycleEnd.getDate()+27);
document.getElementById('cycleRange').textContent = fmtDate(CYCLE_START) + " – " + fmtDate(cycleEnd);

// ---------- Tabs ----------
const TABS = [
  {id:'plan', label:'Plan'},
  {id:'costco', label:'Costco'},
  {id:'week0', label:'Week 1'},
  {id:'week1', label:'Week 2'},
  {id:'week2', label:'Week 3'},
  {id:'week3', label:'Week 4'},
];
const curWeek = currentWeekIndex();
let activeTab = 'week'+curWeek;

const tabsEl = document.getElementById('tabs');
function renderTabs(){
  tabsEl.innerHTML = '';
  TABS.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'tab' + (t.id===activeTab ? ' active':'') + (t.id === 'week'+curWeek ? ' current':'');
    el.innerHTML = t.label + '<span class="dot"></span>';
    el.onclick = ()=>{ activeTab = t.id; renderTabs(); renderPanel(); };
    tabsEl.appendChild(el);
  });
}

// ---------- Storage helpers (localStorage — works in any real browser, incl. once hosted) ----------
function slugKey(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function getCheckedFor(prefix, itemNames){
  const out = new Set();
  itemNames.forEach(name=>{
    try{ if(localStorage.getItem(prefix+slugKey(name)) === '1') out.add(name); }catch(e){}
  });
  return out;
}
function setChecked(prefix, itemKey, val){
  try{
    if(val) localStorage.setItem(prefix+slugKey(itemKey), '1');
    else localStorage.removeItem(prefix+slugKey(itemKey));
    return true;
  }catch(e){ console.error('storage error', e); return false; }
}
function getExtras(prefix){
  try{
    const v = localStorage.getItem(prefix+'__extras');
    return v ? JSON.parse(v) : [];
  }catch(e){ return []; }
}
function setExtras(prefix, arr){
  try{ localStorage.setItem(prefix+'__extras', JSON.stringify(arr)); }catch(e){}
}
function storageSelfTest(){
  try{
    localStorage.setItem('diag_test','ok');
    const ok = localStorage.getItem('diag_test') === 'ok';
    localStorage.removeItem('diag_test');
    return ok ? {ok:true} : {ok:false, stage:'read-back mismatch'};
  }catch(e){
    return {ok:false, stage:'localStorage unavailable — ' + (e && e.message ? e.message : String(e))};
  }
}

// ---------- Panel renderers ----------
const panelEl = document.getElementById('panel');

function renderPanel(){
  panelEl.innerHTML = '';
  if(activeTab === 'plan') return renderPlan();
  if(activeTab === 'costco') return renderChecklist({
    prefix:'checked:costco:', title:'Costco run', sub:'One trip covers the whole month — proteins & frozen veg.',
    items: costcoList()
  });
  const wIdx = parseInt(activeTab.replace('week',''));
  return renderChecklist({
    prefix:`checked:week${wIdx}:`, title:plan[wIdx].label+' — fresh list', sub:'Grab these at your regular grocery store.',
    items: weekFreshList(wIdx)
  });
}

function renderPlan(){
  let html = '';
  plan.forEach((w, idx)=>{
    html += `<div class="week-block"><div class="week-label">${w.label}${idx===curWeek ? ' · current':''}</div>`;
    w.days.forEach((d,i)=>{
      const r = recipes[d.r];
      html += `<div class="day-card" data-key="${idx}-${i}">
        <div class="day-row">
          <span class="day-name">${d.day}${d.slot?' '+d.slot:''}</span>
          <span class="meal-name">${r.name}</span>
          <span class="chev">▸</span>
        </div>
        <div class="recipe-detail">
          ${r.note}
          <div class="tag-row">
            ${r.costco.map(x=>`<span class="tag costco">${x}</span>`).join('')}
            ${r.fresh.map(x=>`<span class="tag fresh">${x}</span>`).join('')}
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  panelEl.innerHTML = `<div class="section-title">The month at a glance</div>
    <div class="section-sub">Tap a meal to see the quick method.</div>${html}`;
  panelEl.querySelectorAll('.day-card').forEach(card=>{
    card.onclick = ()=> card.classList.toggle('open');
  });
}

function renderChecklist({prefix, title, sub, items}){
  const extras = getExtras(prefix);
  const allItems = items.concat(extras.map(name=>({name, meta:'added by you', extra:true})));
  const checkedSet = getCheckedFor(prefix, allItems.map(it=>it.name));
  const doneCount = allItems.filter(it=>checkedSet.has(it.name)).length;

  let html = `<div class="progress-row">
      <span class="progress-text">${doneCount} of ${allItems.length} checked</span>
      <button class="reset-link" id="resetBtn">Reset checks</button>
    </div>`;

  allItems.forEach(it=>{
    const isChecked = checkedSet.has(it.name);
    html += `<div class="list-item" data-name="${it.name.replace(/"/g,'&quot;')}" data-extra="${!!it.extra}">
      <div class="checkbox ${isChecked?'checked':''}"></div>
      <div class="item-label ${isChecked?'checked':''}">${it.name}<div class="item-meta">${it.meta||''}</div></div>
      ${it.extra ? '<div class="item-remove">×</div>' : ''}
    </div>`;
  });

  html += `<div class="add-row">
      <input type="text" id="addInput" placeholder="Add an item…" />
      <button id="addBtn">Add</button>
    </div>`;

  panelEl.innerHTML = `<div class="section-title">${title}</div><div class="section-sub">${sub}</div>${html}`;

  panelEl.querySelectorAll('.list-item').forEach(row=>{
    const name = row.getAttribute('data-name');
    row.querySelector('.checkbox').onclick = (e)=>{
      e.stopPropagation();
      const nowChecked = !row.querySelector('.checkbox').classList.contains('checked');
      row.querySelector('.checkbox').classList.toggle('checked', nowChecked);
      row.querySelector('.item-label').classList.toggle('checked', nowChecked);
      const saved = setChecked(prefix, name, nowChecked);
      const labelEl = row.querySelector('.item-label');
      const existingMark = labelEl.querySelector('.not-saved');
      if(existingMark) existingMark.remove();
      if(!saved){
        const mark = document.createElement('span');
        mark.className = 'not-saved';
        mark.textContent = '⚠ not saved';
        labelEl.appendChild(mark);
      }
      const doneEl = panelEl.querySelector('.progress-text');
      const total = allItems.length;
      const done = panelEl.querySelectorAll('.checkbox.checked').length;
      doneEl.textContent = `${done} of ${total} checked`;
    };
    const removeEl = row.querySelector('.item-remove');
    if(removeEl){
      removeEl.onclick = (e)=>{
        e.stopPropagation();
        const newExtras = extras.filter(n=>n!==name);
        setExtras(prefix, newExtras);
        setChecked(prefix, name, false);
        renderChecklist({prefix, title, sub, items});
      };
    }
  });

  panelEl.querySelector('#resetBtn').onclick = ()=>{
    allItems.forEach(it=> setChecked(prefix, it.name, false));
    renderChecklist({prefix, title, sub, items});
  };

  const addBtn = panelEl.querySelector('#addBtn');
  const addInput = panelEl.querySelector('#addInput');
  addBtn.onclick = ()=>{
    const val = addInput.value.trim();
    if(!val) return;
    const newExtras = extras.concat([val]);
    setExtras(prefix, newExtras);
    renderChecklist({prefix, title, sub, items});
  };
  addInput.onkeydown = (e)=>{ if(e.key==='Enter') addBtn.click(); };
}

renderTabs();
renderPanel();
const diag = storageSelfTest();
if(!diag.ok){
  const b = document.getElementById('storageBanner');
  b.style.display = 'block';
  b.innerHTML = '<strong>Checks aren\'t saving right now.</strong><br>Diagnostic: ' + diag.stage;
}
})();
</script>
</body>
</html>
